name: Release Hardening Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hardening-bootstrap.yml"
      - "scripts/release-hardening.py"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply release hardening patches
        run: python scripts/release-hardening.py

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate Cargo lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Verify locked frontend build
        run: |
          npm ci
          npm run build

      - name: Verify locked Rust core and tests
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --lib --locked

      - name: Commit hardened sources and lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/App.tsx \
            src/copy.ts \
            src/glass.css \
            src-tauri/tauri.conf.json \
            src-tauri/src/core/mod.rs \
            src-tauri/src/core/mux.rs \
            src-tauri/src/core/ai_upscale.rs \
            src-tauri/src/core/interpolation.rs \
            package-lock.json
          # Some runner images include a global Cargo.lock ignore rule; force-track the app lockfile.
          git add -f src-tauri/Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "release: harden mux i18n CSP and dependency locks"
          git push origin HEAD:main
