name: Runtime Source Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-source-audit.yml"
      - "runtime/sources.json"
      - "scripts/audit-runtime-sources.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-windows-runtime-sources:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit pinned upstream archives
        shell: pwsh
        run: ./scripts/audit-runtime-sources.ps1

      - name: Upload audit hashes
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-hashes
          path: runtime-audit-hashes.json
          if-no-files-found: error
          retention-days: 7
