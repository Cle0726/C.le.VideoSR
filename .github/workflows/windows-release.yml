name: Windows Preview Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-release.yml"
      - "src/**"
      - "src-tauri/src/**"
      - "src-tauri/build.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "models/**"
      - "runtime/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:
    inputs:
      strict_runtime:
        description: "Require complete redistribution-ready AI runtime/model bundle"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows-preview:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate preview runtime manifests and staged payloads
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.strict_runtime != true }}
        run: npm run runtime:verify

      - name: Validate complete end-user runtime bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_runtime == true }}
        run: npm run runtime:verify:strict

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: C.le.VideoSR-Windows-Preview
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview.${{ github.run_number }}
          name: C.le.VideoSR v0.1.0 Preview ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Windows preview installer for C.le.VideoSR.

            Included:
            - C.le.VideoSR desktop application
            - Bilingual Chinese / English controls
            - Native Windows acrylic + blue-gray glass workstation UI
            - FFmpeg / NCNN runtime discovery and AI pipeline orchestration
            - Real-ESRGAN / Real-CUGAN / RIFE integration code
            - Model payload readiness checks: a profile is runnable only when its .param/.bin payload pair is present

            Important preview limitation:
            Third-party FFmpeg, NCNN binaries, and AI model payloads are not bundled in this preview while redistribution licenses and notices are being finalized. The application can still be installed and launched normally, but AI processing requires compatible runtimes/models to be staged separately or available through the development PATH.

            This is a prerelease intended for installation and packaging validation, not the final end-user AI bundle.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
